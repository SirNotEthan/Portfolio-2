<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="JetBrains Mono, monospace">
  <rect width="900" height="560" fill="#1C2128"/>

  <!-- Hardware row -->
  <text x="20" y="28" font-size="13" fill="#8B949E">HARDWARE</text>
  <g font-size="12" fill="#C9D1D9">
    <rect x="20" y="40" width="150" height="50" rx="6" fill="#22272E" stroke="#FFB000" stroke-width="1.5"/>
    <text x="95" y="62" text-anchor="middle" fill="#FFB000" font-weight="bold">m910q-01</text>
    <text x="95" y="78" text-anchor="middle" font-size="10">control plane</text>

    <rect x="188" y="40" width="150" height="50" rx="6" fill="#22272E" stroke="#30363D" stroke-width="1.5"/>
    <text x="263" y="62" text-anchor="middle">m700-01</text>
    <text x="263" y="78" text-anchor="middle" font-size="10">worker</text>

    <rect x="356" y="40" width="150" height="50" rx="6" fill="#22272E" stroke="#30363D" stroke-width="1.5"/>
    <text x="431" y="62" text-anchor="middle">m700-02</text>
    <text x="431" y="78" text-anchor="middle" font-size="10">worker</text>

    <rect x="524" y="40" width="150" height="50" rx="6" fill="#22272E" stroke="#30363D" stroke-width="1.5"/>
    <text x="599" y="62" text-anchor="middle">m700-03</text>
    <text x="599" y="78" text-anchor="middle" font-size="10">worker + lab node</text>

    <rect x="692" y="40" width="180" height="50" rx="6" fill="#22272E" stroke="#30363D" stroke-width="1.5"/>
    <text x="782" y="62" text-anchor="middle">hp-utility-01</text>
    <text x="782" y="78" text-anchor="middle" font-size="10">backup + utility</text>
  </g>

  <!-- arrow down -->
  <line x1="450" y1="90" x2="450" y2="130" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- k3s cluster -->
  <rect x="250" y="132" width="400" height="54" rx="6" fill="#22272E" stroke="#00D4FF" stroke-width="1.5"/>
  <text x="450" y="154" text-anchor="middle" fill="#00D4FF" font-weight="bold" font-size="14">k3s cluster</text>
  <text x="450" y="172" text-anchor="middle" fill="#C9D1D9" font-size="10">Traefik ingress · cert-manager · Longhorn storage</text>

  <line x1="450" y1="186" x2="450" y2="226" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Argo CD -->
  <rect x="270" y="228" width="360" height="54" rx="6" fill="#22272E" stroke="#39FF14" stroke-width="1.5"/>
  <text x="450" y="250" text-anchor="middle" fill="#39FF14" font-weight="bold" font-size="14">Argo CD (GitOps)</text>
  <text x="450" y="268" text-anchor="middle" fill="#C9D1D9" font-size="10">reconciles from Git — main branch is source of truth</text>

  <line x1="450" y1="282" x2="450" y2="322" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Applications row -->
  <g font-size="12" fill="#C9D1D9">
    <rect x="60" y="324" width="230" height="70" rx="6" fill="#22272E" stroke="#BD93F9" stroke-width="1.5"/>
    <text x="175" y="346" text-anchor="middle" fill="#BD93F9" font-weight="bold">Identity</text>
    <text x="175" y="364" text-anchor="middle" font-size="10">Authentik SSO</text>
    <text x="175" y="380" text-anchor="middle" font-size="10">least-privilege auth</text>

    <rect x="335" y="324" width="230" height="70" rx="6" fill="#22272E" stroke="#FF79C6" stroke-width="1.5"/>
    <text x="450" y="346" text-anchor="middle" fill="#FF79C6" font-weight="bold">Dashboard</text>
    <text x="450" y="364" text-anchor="middle" font-size="10">Homepage</text>
    <text x="450" y="380" text-anchor="middle" font-size="10">GitOps-managed</text>

    <rect x="610" y="324" width="230" height="70" rx="6" fill="#22272E" stroke="#F1FA8C" stroke-width="1.5"/>
    <text x="725" y="346" text-anchor="middle" fill="#F1FA8C" font-weight="bold">Observability</text>
    <text x="725" y="364" text-anchor="middle" font-size="10">Prometheus · Grafana</text>
    <text x="725" y="380" text-anchor="middle" font-size="10">Loki</text>
  </g>

  <!-- Backups -->
  <line x1="782" y1="90" x2="782" y2="500" stroke="#30363D" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="672" y="470" width="220" height="50" rx="6" fill="#22272E" stroke="#FF5555" stroke-width="1.5"/>
  <text x="782" y="492" text-anchor="middle" fill="#FF5555" font-weight="bold" font-size="12">Backup &amp; recovery</text>
  <text x="782" y="508" text-anchor="middle" fill="#C9D1D9" font-size="10">PV backups (in progress)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B949E"/>
    </marker>
  </defs>

  <text x="20" y="540" font-size="10" fill="#8B949E">v0.2.0 — host + network baseline, Argo CD-managed applications</text>
</svg>
